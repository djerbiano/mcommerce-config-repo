#Configurations H2
spring.jpa.show-sql=true
spring.h2.console.enabled=true
# Nom de base fixe : dans la console H2 (http://localhost:9006/h2-console), utiliser jdbc:h2:mem:testdb
spring.datasource.url=jdbc:h2:mem:testdb

# Affiche le message des exceptions (ex : ExpeditionNotFoundException) dans la reponse d'erreur
server.error.include-message=always

#Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:9102/eureka/
