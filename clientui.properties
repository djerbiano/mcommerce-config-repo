server.port=8080

# Affiche le message des exceptions (ex : ProductBadRequestException) dans la réponse d'erreur
server.error.include-message=always

#Eureka : clientui s'inscrit et lit le registre pour trouver les instances de produits
eureka.client.registerWithEureka=true
eureka.client.fetchRegistry=true
eureka.client.serviceUrl.defaultZone=http://localhost:9102/eureka/

#Identifiants utilisés par Feign pour s'authentifier auprès de la gateway
gateway.user.name=admin
gateway.user.password=admin
