

#Configurations H2
spring.jpa.show-sql=true

# La table est créée par schema.sql : Hibernate ne doit pas la recréer (sinon data.sql est effacé)
spring.jpa.hibernate.ddl-auto=none

# Affiche le message des exceptions (ex : ProductNotFoundException) dans la réponse d'erreur
server.error.include-message=always

spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

#défini l'encodage pour data.sql
spring.datasource.sql-script-encoding=UTF-8

#Nos configurations
mes-configs.limitDeProduits= 2

#Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:9102/eureka/

# Port par défaut 9001, surchargeable au lancement (variable PORT ou --server.port)
server.port=${PORT:9001}
# Identifiant unique par instance dans Eureka (sinon les instances s'écrasent)
eureka.instance.instance-id=${spring.application.name}:${server.port}
